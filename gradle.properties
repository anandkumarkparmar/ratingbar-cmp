# Project-wide Gradle settings
org.gradle.jvmargs=-Xmx8192m -XX:MaxMetaspaceSize=1536m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.workers.max=2
org.gradle.daemon=true
# Configuration on demand not supported by Kotlin Multiplatform
# org.gradle.configureondemand=true
org.gradle.configuration-cache=true

# Kotlin
kotlin.code.style=official
kotlin.mpp.stability.nowarn=true
kotlin.mpp.androidSourceSetLayoutVersion=2
# Disable default hierarchy template due to explicit iOS source set configuration
kotlin.mpp.applyDefaultHierarchyTemplate=false

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# Compose
org.jetbrains.compose.experimental.uikit.enabled=true
org.jetbrains.compose.experimental.jscanvas.enabled=true

# Remote smoke test - uncomment both lines to resolve the library from JitPack
# instead of the local project. Useful for testing a published release end-to-end.
#useRemote=true
#remoteLibraryVersion=1.0.0

# Library version - single source of truth for the published POM version.
# Update this value when cutting a release; build.gradle.kts reads it via property("libraryVersion").
libraryVersion=1.0.0

